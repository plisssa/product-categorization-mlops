[dataset]
label_column = "category_ind"
text_fields = ["vendor", "name", "model", "type_prefix"]
include_domain = false
include_url_tokens = false
description_max_len = 250
url_token_limit = 0

[split]
test_size = 0.15
random_state = 42

[vectorizer]
kind = "word_char"
min_df = 2
sublinear_tf = true

word_ngram_min = 1
word_ngram_max = 2
word_max_features = 90000

char_analyzer = "char_wb"
char_ngram_min = 3
char_ngram_max = 5
char_max_features = 120000

[model]
kind = "linear_svc"
C = 1.0
max_iter = 15000
class_weight = "balanced"
random_state = 42

[run]
name = "run08_word_char_svm_core_no_url"

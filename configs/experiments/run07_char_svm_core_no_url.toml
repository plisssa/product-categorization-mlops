[dataset]
label_column = "category_ind"
text_fields = ["vendor", "name", "model", "type_prefix"]
include_domain = false
include_url_tokens = false
description_max_len = 250
url_token_limit = 0

[split]
test_size = 0.15
random_state = 42

[vectorizer]
kind = "char"
analyzer = "char_wb"
ngram_min = 3
ngram_max = 5
min_df = 2
char_max_features = 180000
sublinear_tf = true

[model]
kind = "linear_svc"
C = 0.75
max_iter = 15000
class_weight = "balanced"
random_state = 42

[run]
name = "run07_char_svm_core_no_url"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box{rx:8; ry:8; stroke:#888; stroke-width:1.5;}
      .t{font-size:13px; fill:#1b2733;}
      .tb{font-size:14px; font-weight:700; fill:#0d1b2a;}
      .lane{font-size:15px; font-weight:700; fill:#33475b;}
      .edge{stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arr);}
      .data{fill:#e8f0fe;}
      .model{fill:#e6f5ea;}
      .serve{fill:#fff3e0;}
      .mon{fill:#fde8ef;}
      .infra{fill:#eee9fb;}
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="720" fill="#ffffff"/>

  <!-- ===== Lane: Research / Training ===== -->
  <text x="24" y="34" class="lane">1. Research / Kaggle  (воспроизводимые эксперименты + MLflow)</text>
  <rect class="box data" x="24" y="50" width="150" height="58"/>
  <text class="tb" x="40" y="74">train/test</text><text class="t" x="40" y="92">.parquet + tree.csv</text>

  <rect class="box data" x="200" y="50" width="160" height="58"/>
  <text class="tb" x="216" y="74">prepare_dataset</text><text class="t" x="216" y="92">full_text, domain, tree</text>

  <rect class="box model" x="386" y="44" width="150" height="32"/>
  <text class="t" x="400" y="65">TF-IDF + SGD/SVM</text>
  <rect class="box model" x="386" y="82" width="150" height="32"/>
  <text class="t" x="400" y="103">E5 (текст) + LogReg</text>
  <rect class="box model" x="386" y="120" width="150" height="32"/>
  <text class="t" x="400" y="141">E5 + CLIP → MLP</text>

  <rect class="box model" x="566" y="62" width="120" height="58"/>
  <text class="tb" x="582" y="86">Ансамбль</text><text class="t" x="582" y="104">blend proba</text>

  <rect class="box data" x="712" y="62" width="140" height="58"/>
  <text class="tb" x="728" y="86">submission.csv</text><text class="t" x="728" y="104">→ Kaggle (macro-F1)</text>

  <rect class="box infra" x="876" y="62" width="140" height="58"/>
  <text class="tb" x="892" y="86">MLflow</text><text class="t" x="892" y="104">params/metrics/model</text>

  <path class="edge" d="M174,79 L200,79"/>
  <path class="edge" d="M360,79 L386,60"/>
  <path class="edge" d="M360,82 L386,98"/>
  <path class="edge" d="M360,88 L386,136"/>
  <path class="edge" d="M536,60 L566,84"/>
  <path class="edge" d="M536,98 L566,91"/>
  <path class="edge" d="M536,136 L566,98"/>
  <path class="edge" d="M686,91 L712,91"/>
  <path class="edge" d="M686,110 C770,150 800,130 876,98"/>

  <!-- best checkpoint to S3 -->
  <rect class="box infra" x="566" y="150" width="120" height="44"/>
  <text class="tb" x="582" y="178">S3 / MinIO</text>
  <path class="edge" d="M626,120 L626,150"/>
  <text class="t" x="632" y="142">checkpoint</text>

  <line x1="24" y1="214" x2="1016" y2="214" stroke="#ccc" stroke-dasharray="4 4"/>

  <!-- ===== Lane: Serving ===== -->
  <text x="24" y="248" class="lane">2. Production / MaaS  (./run_service.sh — один compose)</text>

  <rect class="box data" x="24" y="270" width="120" height="56"/>
  <text class="tb" x="40" y="294">client</text><text class="t" x="40" y="312">POST /predict</text>

  <rect class="box serve" x="190" y="262" width="190" height="72"/>
  <text class="tb" x="206" y="286">Flask gateway</text>
  <text class="t" x="206" y="305">featurize + кэш + метрики</text>
  <text class="t" x="206" y="322">SERVICE_PORT</text>

  <rect class="box serve" x="430" y="256" width="120" height="40"/>
  <text class="t" x="446" y="280">Redis cache</text>
  <rect class="box serve" x="430" y="300" width="120" height="40"/>
  <text class="t" x="446" y="324">model: local</text>

  <rect class="box serve" x="600" y="256" width="270" height="84"/>
  <text class="tb" x="616" y="278">Triton MaaS (ONNX ensemble)</text>
  <text class="t" x="616" y="298">preprocess → text_encoder(E5)</text>
  <text class="t" x="616" y="316">→ category_head → postprocess</text>
  <text class="t" x="616" y="333">→ CATEGORY_IND</text>

  <rect class="box data" x="430" y="356" width="140" height="40"/>
  <text class="t" x="446" y="380">{category_ind}</text>

  <path class="edge" d="M144,298 L190,298"/>
  <path class="edge" d="M380,288 L430,276"/>
  <path class="edge" d="M380,300 L430,320"/>
  <path class="edge" d="M380,312 L600,300"/>
  <path class="edge" d="M285,334 L460,356"/>
  <path class="edge" d="M626,150 C520,210 470,250 490,300" stroke-dasharray="5 4"/>

  <!-- ===== Lane: Observability ===== -->
  <text x="24" y="452" class="lane">3. Observability &amp; Automation</text>

  <rect class="box mon" x="24" y="470" width="150" height="52"/>
  <text class="tb" x="40" y="492">Prometheus</text><text class="t" x="40" y="510">scrape /metrics</text>
  <rect class="box mon" x="200" y="470" width="150" height="52"/>
  <text class="tb" x="216" y="492">Grafana</text><text class="t" x="216" y="510">дашборд</text>
  <rect class="box mon" x="376" y="470" width="160" height="52"/>
  <text class="tb" x="392" y="492">Alertmanager</text><text class="t" x="392" y="510">пороги/алерты</text>
  <rect class="box mon" x="562" y="470" width="180" height="52"/>
  <text class="tb" x="578" y="492">Evidently</text><text class="t" x="578" y="510">Data/Concept Drift</text>
  <rect class="box infra" x="768" y="470" width="160" height="52"/>
  <text class="tb" x="784" y="492">Airflow</text><text class="t" x="784" y="510">@daily retrain+drift</text>

  <path class="edge" d="M250,334 C250,420 110,440 100,470"/>
  <path class="edge" d="M174,496 L200,496"/>
  <path class="edge" d="M350,496 L376,496"/>
  <path class="edge" d="M742,496 L768,496"/>
  <path class="edge" d="M848,470 C880,360 760,350 870,340" stroke-dasharray="5 4"/>

  <!-- ===== Lane: CI/CD ===== -->
  <rect class="box infra" x="24" y="560" width="1000" height="48"/>
  <text class="tb" x="40" y="582">GitLab CI/CD:</text>
  <text class="t" x="150" y="582">lint (ruff) → test (pytest) → build (docker image сервиса) — на каждый push в master</text>

  <text x="24" y="650" class="t">Зависимости фиксируются через uv (pyproject + lock). Секреты — только в .env (в git не попадают).</text>
  <text x="24" y="672" class="t">Данные и чекпойнты — на S3/MinIO, не в репозитории.</text>
</svg>

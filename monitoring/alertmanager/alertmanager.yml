route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "default"
    # Замените на реальный webhook (Telegram/Slack/email). Пример webhook-приёмника:
    webhook_configs:
      - url: "http://localhost:9099/alert"
        send_resolved: true
